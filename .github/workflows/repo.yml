name: Publish repository

# Tag pushes cut a release; main pushes only refresh what gh-pages serves.
# Without the branch trigger the published site froze at the last tag, so a
# screenshots-or-copy-only commit landed on main and the gallery kept showing
# the previous release's UI until someone dispatched this by hand. The job is
# ~11s and idempotent, and "Create GitHub release" below is gated on refs/tags,
# so republishing per commit costs nothing and cannot mint a stray release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Serialized, because a release pushes the commit and its tag together and both
# match the triggers above: two runs then deployed to gh-pages at once, one lost
# the ref-lock race ("cannot lock ref 'refs/heads/gh-pages'"), and because the
# deploy precedes "Create GitHub release" the loser died before creating it -
# v0.12.0 shipped to the repository with no GitHub release until the job was
# re-run by hand. Queue instead: never cancel, since the cancelled run could be
# the tag's, and the tag's is the only one that cuts a release.
concurrency:
  group: publish-repository
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tag-bound publishing needs the tag list, which a shallow clone
          # does not carry: without this the newest-tag lookup below finds
          # nothing and the run fails rather than silently publishing HEAD.
          fetch-depth: 0

      - name: Build repository tree
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import shutil
          import subprocess
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          # What is published is the newest RELEASE TAG, never the commit that
          # triggered this run. main pushes still refresh gh-pages - that is
          # what the branch trigger exists for - but they used to rebuild
          # plugin.video.rivulet-<version>.zip from HEAD, so the file served
          # as "0.21.0" quietly absorbed every post-release commit while
          # keeping the released version number. Kodi caches by version, so
          # installed copies never saw those commits and only fresh installs
          # got them: two different trees under one version string, and no way
          # to tell which one a bug report ran. Tags are read from the tag list
          # rather than from the trigger ref, so the branch run and the tag run
          # of the same release publish identical bytes whichever wins the
          # queue above.
          TAGS = subprocess.run(
              ["git", "tag", "--sort=-v:refname", "--list", "v*"],
              capture_output=True, text=True, check=True,
          ).stdout.split()


          def newest_tag(addon_id, pattern):
              # Matched strictly, because -v:refname sorts a prerelease above
              # the release it precedes: a v0.22.0-rc.1 left on the repo would
              # otherwise be published as the current package.
              tags = [t for t in TAGS if re.fullmatch(pattern, t)]
              if not tags:
                  raise SystemExit("no release tag found for %s" % addon_id)
              return tags[0]


          # The repository addon is released on its own -repo tags and the
          # addon on plain vX.Y.Z ones, so each is published from its own
          # newest tag: releasing one must not republish the other's HEAD.
          ADDONS = {
              "plugin.video.rivulet": {
                  "icon": "resources/icon.png",
                  "fanart": "resources/fanart.jpg",
                  "archive_ref": newest_tag(
                      "plugin.video.rivulet", r"v\d+\.\d+\.\d+"
                  ),
                  "archive_paths": ["addon.xml", "default.py", "service.py", "resources", "lib", "LICENSE"],
              },
              "repository.rivulet": {
                  "icon": "icon.png",
                  "fanart": "fanart.jpg",
                  "archive_ref": "%s:repository.rivulet" % newest_tag(
                      "repository.rivulet", r"v\d+\.\d+\.\d+-repo"
                  ),
                  "archive_paths": [],
              },
          }

          repo_dir = Path("_repo")
          if repo_dir.exists():
              shutil.rmtree(repo_dir)
          repo_dir.mkdir(parents=True)
          shutil.copytree("site", repo_dir, dirs_exist_ok=True)


          addons_root = ET.Element("addons")

          for addon_id, info in ADDONS.items():
              addon_dir = repo_dir / addon_id
              addon_dir.mkdir(parents=True)

              staged = addon_dir / "staged.zip"
              cmd = [
                  "git", "archive", "--format=zip",
                  f"--prefix={addon_id}/",
                  "-o", str(staged),
                  info["archive_ref"],
              ]
              if info["archive_paths"]:
                  cmd += ["--", *info["archive_paths"]]
              subprocess.run(cmd, check=True)

              # Everything published is read back out of the zip that ships,
              # not off the checkout, so the index, the artwork and the
              # payload cannot disagree about which tree they came from.
              with zipfile.ZipFile(staged) as zf:
                  addon_el = ET.fromstring(zf.read("%s/addon.xml" % addon_id))
                  version = addon_el.get("version")
                  addons_root.append(addon_el)

                  (addon_dir / "icon.png").write_bytes(
                      zf.read("%s/%s" % (addon_id, info["icon"]))
                  )
                  (addon_dir / "fanart.jpg").write_bytes(
                      zf.read("%s/%s" % (addon_id, info["fanart"]))
                  )

                  # Kodi resolves <assets> paths RELATIVE TO THE ADDON'S
                  # FOLDER IN THE REPOSITORY, and fetches them as loose files
                  # - it does not look inside the zip. addon.xml declares
                  # <icon>resources/icon.png</icon> plus four
                  # resources/screenshots/*.png, so publishing only the flat
                  # icon.png/fanart.jpg above left Kodi's add-on browser
                  # fetching .../plugin.video.rivulet/resources/icon.png and
                  # getting a 404: no icon, no fanart and an empty screenshot
                  # gallery for anyone installing from the repository. The
                  # flat copies stay for the older bare-icon.png convention;
                  # these are the declared ones.
                  metadata = addon_el.find("extension[@point='xbmc.addon.metadata']")
                  assets = metadata.find("assets") if metadata is not None else None
                  for asset in (list(assets) if assets is not None else []):
                      rel = (asset.text or "").strip()
                      if not rel:
                          continue
                      try:
                          payload = zf.read("%s/%s" % (addon_id, rel))
                      except KeyError:
                          raise SystemExit(
                              "%s declares asset %r but %s does not carry it"
                              % (addon_id, rel, info["archive_ref"])
                          )
                      dest = addon_dir / rel
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(payload)

              zip_path = addon_dir / f"{addon_id}-{version}.zip"
              staged.replace(zip_path)

              # GitHub Pages serves no directory autoindex, so
              # .../plugin.video.rivulet/ was a 404 and the way people
              # actually install a Kodi repo - add a file source, then
              # "Install from zip file" and browse it - showed an empty
              # folder. Kodi's HTTP directory reader lists <a href> targets,
              # and the zip dialog filters them to .zip, so a plain listing
              # per addon folder is all that flow needs.
              (addon_dir / "index.html").write_text(
                  "<!DOCTYPE html>\n<meta charset=\"utf-8\">\n"
                  f"<title>{addon_id} {version}</title>\n"
                  f"<h1>{addon_id} {version}</h1>\n<ul>\n"
                  f'<li><a href="{zip_path.name}">{zip_path.name}</a></li>\n'
                  '<li><a href="addon.xml">addon.xml</a></li>\n'
                  "</ul>\n"
              )

              # Version-less alias at the repository root. The versioned
              # filename is what ends up copied into forum posts and then
              # 404s the moment the next release lands - people were still
              # passing round repository.rivulet-1.0.0.zip well after 1.0.1
              # shipped. This URL stays correct across releases.
              shutil.copyfile(zip_path, repo_dir / f"{addon_id}.zip")

          addons_xml_path = repo_dir / "addons.xml"
          ET.ElementTree(addons_root).write(
              addons_xml_path, encoding="UTF-8", xml_declaration=True
          )

          digest = hashlib.md5(addons_xml_path.read_bytes()).hexdigest()
          (repo_dir / "addons.xml.md5").write_text(digest)
          PY

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_repo
          publish_branch: gh-pages

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Only the tag shapes the build step publishes from. Any other tag -
          # a prerelease, say - still triggers this workflow, and releasing it
          # would attach the current stable zips to a release named after a
          # tree that was never published. github expressions cannot match a
          # pattern, so the check lives here, next to the tag it guards.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-repo)?$'; then
            echo "$TAG is not a release tag; published nothing to release" >&2
            exit 0
          fi
          ASSETS=(_repo/plugin.video.rivulet/plugin.video.rivulet-*.zip _repo/repository.rivulet/repository.rivulet-*.zip)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          fi
