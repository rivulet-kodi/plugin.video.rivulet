name: Publish repository

# Tag pushes cut a release; main pushes only refresh what gh-pages serves.
# Without the branch trigger the published site froze at the last tag, so a
# screenshots-or-copy-only commit landed on main and the gallery kept showing
# the previous release's UI until someone dispatched this by hand. The job is
# ~11s and idempotent, and "Create GitHub release" below is gated on refs/tags,
# so republishing per commit costs nothing and cannot mint a stray release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Serialized, because a release pushes the commit and its tag together and both
# match the triggers above: two runs then deployed to gh-pages at once, one lost
# the ref-lock race ("cannot lock ref 'refs/heads/gh-pages'"), and because the
# deploy precedes "Create GitHub release" the loser died before creating it -
# v0.12.0 shipped to the repository with no GitHub release until the job was
# re-run by hand. Queue instead: never cancel, since the cancelled run could be
# the tag's, and the tag's is the only one that cuts a release.
concurrency:
  group: publish-repository
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build repository tree
        run: |
          python3 - <<'PY'
          import hashlib
          import shutil
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ADDONS = {
              "plugin.video.rivulet": {
                  "addon_xml": Path("addon.xml"),
                  "icon": Path("resources/icon.png"),
                  "fanart": Path("resources/fanart.jpg"),
                  "archive_ref": "HEAD",
                  "archive_paths": ["addon.xml", "default.py", "service.py", "resources", "lib", "LICENSE"],
              },
              "repository.rivulet": {
                  "addon_xml": Path("repository.rivulet/addon.xml"),
                  "icon": Path("repository.rivulet/icon.png"),
                  "fanart": Path("repository.rivulet/fanart.jpg"),
                  "archive_ref": "HEAD:repository.rivulet",
                  "archive_paths": [],
              },
          }

          repo_dir = Path("_repo")
          if repo_dir.exists():
              shutil.rmtree(repo_dir)
          repo_dir.mkdir(parents=True)
          shutil.copytree("site", repo_dir, dirs_exist_ok=True)


          addons_root = ET.Element("addons")

          for addon_id, info in ADDONS.items():
              addon_dir = repo_dir / addon_id
              addon_dir.mkdir(parents=True)

              tree = ET.parse(info["addon_xml"])
              addon_el = tree.getroot()
              version = addon_el.get("version")
              addons_root.append(addon_el)

              shutil.copyfile(info["addon_xml"], addon_dir / "addon.xml")
              shutil.copyfile(info["icon"], addon_dir / "icon.png")
              shutil.copyfile(info["fanart"], addon_dir / "fanart.jpg")

              # Kodi resolves <assets> paths RELATIVE TO THE ADDON'S FOLDER IN
              # THE REPOSITORY, and fetches them as loose files - it does not
              # look inside the zip. addon.xml declares
              # <icon>resources/icon.png</icon> plus four
              # resources/screenshots/*.png, so publishing only the flat
              # icon.png/fanart.jpg above left Kodi's add-on browser fetching
              # .../plugin.video.rivulet/resources/icon.png and getting a 404:
              # no icon, no fanart and an empty screenshot gallery for anyone
              # installing from the repository. The flat copies stay for the
              # older bare-icon.png convention; these are the declared ones.
              source_root = info["addon_xml"].parent
              metadata = addon_el.find("extension[@point='xbmc.addon.metadata']")
              assets = metadata.find("assets") if metadata is not None else None
              for asset in (list(assets) if assets is not None else []):
                  rel = (asset.text or "").strip()
                  if not rel:
                      continue
                  src = source_root / rel
                  if not src.is_file():
                      raise SystemExit(
                          "%s declares asset %r but %s does not exist" % (addon_id, rel, src)
                      )
                  dest = addon_dir / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src, dest)

              zip_path = addon_dir / f"{addon_id}-{version}.zip"
              cmd = [
                  "git", "archive", "--format=zip",
                  f"--prefix={addon_id}/",
                  "-o", str(zip_path),
                  info["archive_ref"],
              ]
              if info["archive_paths"]:
                  cmd += ["--", *info["archive_paths"]]
              subprocess.run(cmd, check=True)

              # GitHub Pages serves no directory autoindex, so
              # .../plugin.video.rivulet/ was a 404 and the way people
              # actually install a Kodi repo - add a file source, then
              # "Install from zip file" and browse it - showed an empty
              # folder. Kodi's HTTP directory reader lists <a href> targets,
              # and the zip dialog filters them to .zip, so a plain listing
              # per addon folder is all that flow needs.
              (addon_dir / "index.html").write_text(
                  "<!DOCTYPE html>\n<meta charset=\"utf-8\">\n"
                  f"<title>{addon_id} {version}</title>\n"
                  f"<h1>{addon_id} {version}</h1>\n<ul>\n"
                  f'<li><a href="{zip_path.name}">{zip_path.name}</a></li>\n'
                  '<li><a href="addon.xml">addon.xml</a></li>\n'
                  "</ul>\n"
              )

              # Version-less alias at the repository root. The versioned
              # filename is what ends up copied into forum posts and then
              # 404s the moment the next release lands - people were still
              # passing round repository.rivulet-1.0.0.zip well after 1.0.1
              # shipped. This URL stays correct across releases.
              shutil.copyfile(zip_path, repo_dir / f"{addon_id}.zip")

          addons_xml_path = repo_dir / "addons.xml"
          ET.ElementTree(addons_root).write(
              addons_xml_path, encoding="UTF-8", xml_declaration=True
          )

          digest = hashlib.md5(addons_xml_path.read_bytes()).hexdigest()
          (repo_dir / "addons.xml.md5").write_text(digest)
          PY

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_repo
          publish_branch: gh-pages

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          ASSETS=(_repo/plugin.video.rivulet/plugin.video.rivulet-*.zip _repo/repository.rivulet/repository.rivulet-*.zip)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --title "$TAG" --generate-notes
          fi
