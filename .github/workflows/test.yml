name: Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Interpreters come from uv (python-build-standalone), not
    # actions/setup-python: the latter ships no 3.8 build for Ubuntu 26.04,
    # and the 3.8 leg holds the Kodi 19 floor. uv keeps every leg on
    # ubuntu-latest without depending on what the runner image provides.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.8', '3.11', '3.13' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }} (uv)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tag upstream)
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt

      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt

      - name: Run tests with coverage
        # Threshold is explicit here (not only [tool.coverage.report] fail_under)
        # so lowering it is a visible workflow change.
        run: pytest tests/ --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: S4Me bridge tests
        run: pytest tests/test_s4me.py tests/test_s4me_bridge_helpers.py -q

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  compat-py38-requests:
    # 3.8 comes from uv for the same reason as the 3.8 `test` leg above.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.8 (uv)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3 (no floating major tag upstream)
        with:
          python-version: '3.8'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt

      - name: Install dev dependencies
        run: uv pip install -r requirements-dev.txt

      - name: Force requests floor to 2.22.0
        run: uv pip install "requests==2.22.0"

      - name: Record installed requests version
        run: python -c "import requests; print('requests', requests.__version__)"

      - name: Run full test suite
        run: pytest tests/

  lint-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check lib tests resources/s4me_bridge tools

      - name: Type check (mypy)
        run: mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements-dev.txt --strict
