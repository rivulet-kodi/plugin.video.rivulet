[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    # Hypothesis warns when it renders a very large failing example. It only
    # does so while reporting a failure, where "error" would replace the real
    # assertion with this warning.
    "ignore:Generating overly large repr:hypothesis.errors.HypothesisWarning",
]

[tool.coverage.run]
# No explicit `source` list: coverage.py treats non-directory `source`
# entries as importable dotted module names (matched by the *executing*
# module's `__name__`), not file paths - `default.py`/`service.py` run as
# `__main__` (tests/test_entrypoints.py, via runpy) never match under that
# scheme, so they'd silently go unmeasured. Bare `omit` below, with no
# `source` restriction, instead lets coverage's own stdlib/site-packages
# detection (which already excludes `.venv/`) do the filtering, while still
# reaching every executed line under the repo, including both entry
# scripts - `make cov` (bare `--cov`, see Makefile) verifies
# `default.py`/`service.py` land at 100% in `--cov-report=term-missing`.
branch = true
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.vulture]
# Dead-code check over what ships, plus the whitelist of names reached
# dynamically (each entry there says who reaches it).
paths = ["lib", "default.py", "service.py", "vulture_whitelist.py"]
# Kept verbatim so they stay diffable against upstream; their unused API
# is upstream's, not ours.
exclude = [
    # Nayuki QR-Code-generator (MIT), python/qrcodegen.py at 777682a.
    "lib/qrcodegen.py",
    # Port of pieroxy's lz-string (https://github.com/pieroxy/lz-string),
    # kept bit-for-bit with it; its decoder is the reference inverse.
    "lib/stremio/lzstring.py",
]
min_confidence = 60
sort_by_size = true
ignore_names = [
    # xbmcgui.WindowXML / WindowXMLDialog: Kodi calls these on our screens.
    "onInit",
    "onClick",
    # xbmc.Player: Kodi calls these (service_runner.py, streamswindow.py).
    "onAVStarted",
    "onPlayBackStopped",
    "onPlayBackEnded",
    "onPlayBackError",
    # xbmc.Monitor: Kodi calls it when a setting changes (service_runner.py).
    "onSettingsChanged",
    # http.server / socketserver hooks the stdlib reads or calls by name
    # (pairing.py's handler and server).
    "do_GET",
    "do_POST",
    "log_message",
    "version_string",
    "handle_error",
    "protocol_version",
    "daemon_threads",
    "allow_reuse_address",
    "close_connection",
]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["lib", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C901"]
ignore = [
    # 97 pre-existing %-format call sites span lib/ and tests/; converting all of
    # them to str.format/f-strings is a sweeping rewrite outside this slice's scope.
    "UP031",
]

[tool.ruff.lint.mccabe]
# Complexity gate (C901). New code must stay at or below 15; the handful of
# pre-existing offenders are exempted per file / per function below so the
# gate ratchets instead of blocking on legacy code. service_runner.py has
# no file-level exemption: Supervisor/ServiceMonitor must stay under it.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"lib/s4me.py" = ["C901"]
"lib/stremio/lzstring.py" = ["C901"]
"lib/ui/player.py" = ["C901"]
"lib/ui/streamswindow.py" = ["C901"]
# Vendored Nayuki QR encoder (MIT), python/qrcodegen.py from nayuki/QR-Code-generator at
# 777682a (2025-01-04). One local change: _BitBuffer subclasses plain list (not list[int])
# so it imports on Python 3.8. Otherwise as published; ruff exemptions keep it that way.
"lib/qrcodegen.py" = ["E101", "E401", "I001", "C901", "E501", "UP", "B"]
"resources/s4me_bridge/*" = ["C901"]
"tests/kodistubs/*" = ["C901"]
"lib/*" = [
    # 18 pre-existing lib/ui/* and lib/stremio/* lines run 101-111 cols; fixing
    # them means reformatting lib/, which is out of scope for this config slice.
    "E501",
    # 15 pre-existing `except ... raise Err(...)` sites in lib/serverbin.py and
    # lib/stremio/* don't chain `from exc`; adding it is a lib/ behavior/style
    # change outside this slice's scope (lib/ is owned by other slices).
    "B904",
]
"tests/*" = [
    # test_server.py imports mid-file, after a documented monkeypatch-setup
    # comment block; that ordering is deliberate, not disorganized.
    "E402",
    # Test data (long URLs, parametrize ids, inline meta dicts) reads better
    # unwrapped; E501 is already ignored for lib/* above, so keep it uniform.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["lib", "tests"]

[tool.mypy]
# 3.9 is the lowest target current mypy (>=1.15) accepts; mypy <2.0 still
# refuses 3.8 here. Real Python-3.8 runtime compatibility (Kodi 19 Matrix) is
# guarded instead by the CI test matrix, which runs the suite on 3.8.
python_version = "3.9"
# Kodi's own modules (xbmc, xbmcgui, xbmcaddon, ...) are never pip-installed
# and have no stubs anywhere; they're imported across most of lib/ui, so
# scoping this per-module would mean listing every UI file individually for
# no benefit. Kept project-wide for that reason.
ignore_missing_imports = true
warn_unused_ignores = false
files = ["lib", "default.py", "service.py"]

[[tool.mypy.overrides]]
# mypy <2.0 special-cases a handful of packages it used to bundle stubs for
# (requests among them): `ignore_missing_imports` alone doesn't silence their
# "Library stubs not installed" [import-untyped] error. Disabling the error
# code, scoped to only the modules that import requests, covers it cleanly
# without adding a types-requests dev dependency.
module = [
    "lib.stremio.addons", "lib.stremio.api", "lib.stremio.server", "lib.serverbin",
    "lib.stremio.ratings", "lib.ui.logocheck", "lib.ui.trailer",
    "lib.stremio.linklogin",
]
disable_error_code = ["import-untyped"]

# Duplication gate: `pylint lib default.py service.py` (`make dupes`, and
# the `lint-type` CI job). Pylint is used for ONE check, duplicate-code
# (R0801); ruff stays the linter. Six or more matching lines, after
# dropping imports, docstrings and comments, fail it. Extract a helper in
# the right layer instead (never an xbmc import into a Kodi-independent
# module). Copies kept on purpose (Kodi independence, per-call-site
# fan-out bounds, two protocol shapes that only look alike) get a
# file-level `# pylint: disable=duplicate-code` with the reason beside it;
# none are needed today.
[tool.pylint.main]
# 3.8 is the floor (Kodi 19); pylint parses with the running interpreter,
# this only keeps version-dependent checks honest.
py-version = "3.8"
reports = false
score = false

[tool.pylint."messages control"]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports = true
ignore-docstrings = true
ignore-comments = true
